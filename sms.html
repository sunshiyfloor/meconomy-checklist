<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf7f3">
<meta name="description" content="MECONOMY 예약 문의 문자 작성">
<title>RESERVATION | MECONOMY</title>
<style>
:root{--bg:#faf7f3;--ink:#382720;--muted:#938b85;--placeholder:#bbb4ae;--stroke:#d6d1cb;--accent:#b88c68;--button-disabled:#c7beb7;--button-active:#a97956}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg)}
body{margin:0;min-height:100svh;color:var(--ink);background:var(--bg);font-family:"Apple SD Gothic Neo",Pretendard,"Noto Sans KR",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit}
a{color:inherit;text-decoration:none}
button,a,input{ -webkit-tap-highlight-color:transparent }
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #b88c68;outline-offset:3px}
.page{max-width:760px;margin:auto;min-height:100svh;display:flex;flex-direction:column;padding:0 clamp(16px,4.2vw,31px);background:var(--bg)}
.topbar{min-height:128px;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;padding-top:51px;gap:10px}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:29px;height:36px;background:none;border:0;padding:0;color:#392920;cursor:pointer}
.iconbtn svg{display:block;width:23px;height:23px}
.rightnav{justify-self:end;display:flex;gap:24px;align-items:center}
.topbar h1{font-size:clamp(17px,3.7vw,22px);letter-spacing:.005em;color:var(--accent);font-weight:700;margin:7px 0 0;text-align:center;white-space:nowrap}
.form{display:flex;flex:1;flex-direction:column;min-height:0}
.space{height:clamp(58px,14.5svh,180px);flex:0 0 auto}
.fields{display:grid;gap:11px}
.inputbox{display:flex;align-items:center;gap:16px;min-height:64px;padding:11px 18px;border:1.35px solid var(--stroke);border-radius:8px;background:transparent}
.inputbox label{color:#918882;flex:0 0 auto;white-space:nowrap;font-size:clamp(16px,3.5vw,20px);font-weight:600}
.inputbox input{color:var(--ink);min-width:0;flex:1;border:0;background:none;outline:0;line-height:1.5;font-size:clamp(16px,3.6vw,20px);font-weight:400;padding:2px 0;box-shadow:none;border-radius:0}
.inputbox input:focus-visible{outline:none}
.inputbox:focus-within{border-color:#b48b6d;box-shadow:0 0 0 1px #b48b6d55}
.inputbox input::placeholder{color:var(--placeholder);opacity:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two .inputbox{gap:16px}
.two .inputbox input{width:100%}
.phone{margin-top:0}
.disclosure{font-size:clamp(13px,2.9vw,16px);line-height:1.75;color:#3e302a;word-break:keep-all;letter-spacing:-.035em;margin:26px 0 12px}
.accept{display:flex;align-items:flex-start;gap:10px;font-size:clamp(14px,3.2vw,17px);line-height:1.6;font-weight:500;cursor:pointer}
.accept input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent);flex:0 0 auto;cursor:pointer}
.accept span{flex:1}
.gap{flex:1;min-height:55px}
.submit{width:100%;border-radius:999px;min-height:61px;padding:14px 17px;border:0;background:var(--button-active);color:#fff;font-size:clamp(17px,3.6vw,21px);font-weight:800;letter-spacing:-.045em;cursor:pointer}
.submit:disabled{background:var(--button-disabled);cursor:not-allowed}
.err{font-size:13px;line-height:1.45;color:#ac3428;text-align:center;min-height:0;margin:0 0 8px}
.bottom{padding:0 0 max(27px,env(safe-area-inset-bottom));}
.small{font-size:11px;line-height:1.55;color:#8d827c;text-align:center;margin:10px 0 0}
@media(min-width:680px){.page{padding-left:35px;padding-right:35px}.topbar{min-height:160px}.space{height:190px}.inputbox{min-height:83px}.fields{gap:17px}.two{gap:17px}.disclosure{margin-top:34px;font-size:19px}.accept{font-size:20px}.submit{min-height:75px}.bottom{padding-bottom:50px}}
@media(max-height:720px){.topbar{min-height:94px;padding-top:27px}.space{height:38px}.gap{min-height:32px}.inputbox{min-height:57px}.disclosure{margin-top:21px}}
@media(max-width:350px){.inputbox{gap:10px;padding-left:12px;padding-right:12px}.two{gap:7px}.two .inputbox{gap:9px}.topbar h1{font-size:16px}.rightnav{gap:11px}}
</style>
</head>
<body>
<div class="page">
<header class="topbar" aria-label="상단 메뉴">
  <a class="iconbtn" href="./index.html" title="뒤로" aria-label="체크리스트로 돌아가기">
    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
  </a>
  <h1>RESERVATION</h1>
  <div class="rightnav">
    <a class="iconbtn" href="./index.html" title="홈" aria-label="체크리스트 홈">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7"/><path d="M5.5 9.5V21h5v-7h3v7h5V9.5"/></svg>
    </a>
    <span class="iconbtn" title="인스타그램 아이콘" aria-label="인스타그램">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.1"><rect x="2.5" y="2.5" width="19" height="19" rx="5.5"/><circle cx="12" cy="12" r="4"/><circle cx="17.7" cy="6.3" r=".9" fill="currentColor" stroke="none"/></svg>
    </span>
  </div>
</header>

<form class="form" id="reservationForm" novalidate>
  <div class="space" aria-hidden="true"></div>
  <div class="fields">
    <div class="inputbox">
      <label for="name">이름</label>
      <input id="name" type="text" maxlength="30" placeholder="홍길동" autocomplete="name" required>
    </div>
    <div class="inputbox phone">
      <label for="phone">연락처</label>
      <input id="phone" type="tel" inputmode="tel" maxlength="15" placeholder="010-0000-0000" autocomplete="tel" required>
    </div>
    <div class="two">
      <div class="inputbox">
        <label for="age">나이</label>
        <input id="age" type="number" min="1" max="120" inputmode="numeric" placeholder="28" required>
      </div>
      <div class="inputbox">
        <label for="mbti">MBTI</label>
        <input id="mbti" type="text" maxlength="4" inputmode="text" autocapitalize="characters" spellcheck="false" placeholder="ENFP" required>
      </div>
    </div>
  </div>
  <p class="disclosure">입력하신 이름, 연락처, 나이, MBTI는 예약 문의 문자 작성 목적으로만 사용되며 사이트 서버에 저장되지 않습니다. 문자 발송 시 수신자에게 해당 정보가 전달될 수 있습니다. 본 개인정보 수집·이용에 동의하지 않으실 수 있으나, 미동의 시 문자 작성이 제한됩니다.</p>
  <label class="accept" for="consent"><input id="consent" type="checkbox" required><span>개인정보 수집 및 이용에 동의합니다.</span></label>
  <div class="gap" aria-hidden="true"></div>
  <div class="bottom">
    <p class="err" id="error" role="alert"></p>
    <button class="submit" id="send" type="submit" disabled>예약 문자 보내기</button>
    <p class="small">문자 앱이 열리면 받는 사람을 지정하고 직접 전송해 주세요.</p>
  </div>
</form>
</div>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const ids=["name","phone","age","mbti"];
const form=$("reservationForm"),btn=$("send");
function data(){
  return {name:$("name").value.trim(),phone:$("phone").value.replace(/[^0-9+]/g,""),age:$("age").value.trim(),mbti:$("mbti").value.trim().toUpperCase()};
}
function complete(){
  const x=data();
  return !!x.name && /^(?:0\d{8,10}|\+82\d{9,10})$/.test(x.phone) && Number.isInteger(Number(x.age)) && +x.age>=1 && +x.age<=120 && /^[EI][SN][TF][JP]$/.test(x.mbti) && $("consent").checked;
}
function update(){
  $("mbti").value=$("mbti").value.toUpperCase();
  btn.disabled=!complete();
  $("error").textContent="";
}
ids.forEach(id=>$(id).addEventListener("input",update));
$("consent").addEventListener("change",update);
$("phone").addEventListener("blur",function(){
  const v=this.value.replace(/\D/g,"");
  if(v.length===11 && v.startsWith("010"))this.value=v.replace(/(\d{3})(\d{4})(\d{4})/,"$1-$2-$3");
});
form.addEventListener("submit",function(e){
  e.preventDefault();
  if(!complete()){btn.disabled=true;$("error").textContent="정보를 모두 입력하고 개인정보 동의에 체크해 주세요.";return}
  const x=data();
  const message="안녕하세요. 예약 문의드립니다.\n\n이름: "+x.name+"\n연락처: "+x.phone+"\n나이: "+x.age+"\nMBTI: "+x.mbti;
  const uri="sms:?body="+encodeURIComponent(message);
  window.location.href=uri;
});
update();
})();
</script>
</body>
</html>
